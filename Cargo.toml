[workspace]
members = [
    "program",
    "crates/core",
    "crates/hostbuilder",
    "crates/datahandler",
    "crates/portfoliohandler",
    "crates/signalgenerator",
    "crates/config",
    "crates/orderbook",
    "crates/portfolio",
    "crates/executionhandler",
    "crates/smartorderrouter",
    "crates/exchangemetricaggregator",
    "crates/strategyhandler",
    "crates/signal",
    "crates/signaldispatcher",
    "crates/ultra-logger",
    "crates/protocol",
    "crates/subscriber",
]
resolver = "2"

[workspace.dependencies]
# Logging engine
ultra-logger = { path = "crates/ultra-logger" }

# Performance optimizations
crossbeam = "0.8"
dashmap = "5.0"
bytes = "1.0"
bincode = "1.3"
socket2 = "0.5"
futures = "0.3"
fastrand = "2.0"
serde = { version = "1.0", features = ["derive"] }
atomic = "0.6"

[profile.release-optimized]
inherits = "release"
opt-level = 3
codegen-units = 1
panic = "abort"
lto = "fat"
debug = false
overflow-checks = false
