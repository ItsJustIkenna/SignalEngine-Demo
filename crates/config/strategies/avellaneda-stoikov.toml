# Avellaneda-Stoikov Market Making Strategy Configuration
# EXAMPLE parameters only - not tuned, not validated, and not a recommendation

[strategy]
name = "Avellaneda-Stoikov Market Maker"
type = "avellaneda-stoikov"
version = "1.0.0"
enabled = true
description = "Example market making strategy based on the Avellaneda-Stoikov spread model"

[parameters]
risk_aversion = 0.1
inventory_target = 0.0
order_size = 100.0
window_ms = 1000
min_quote_lifetime_ms = 100
fee_rate = 0.001
latency_buffer = 0.5
volatility_cap = 0.2

[trading]
symbol = "BTCUSD"
exchange = "kraken"
max_position_pct = 0.05  # 5% of portfolio
stop_loss_pct = 0.02     # 2% stop loss
daily_loss_limit = 1000.0
cooldown_minutes = 30
risk_scaling = 1.0

[export_runtime]
paper_trading = true
paper_trading_days = 7
max_orders_per_second = 10
min_spread_bps = 5       # Minimum 5 basis points spread

[metadata]
exported_at = "2025-08-29T19:12:00Z"
exported_by = "backtesting-engine"
authorized_by = "system"
approval_level = "development"
